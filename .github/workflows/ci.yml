name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Static checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Validate schemas and records
        run: |
          python scripts/validate.py --examples
          python scripts/format.py --check
      - name: Test
        run: python -m pytest -q
      - name: Reproducible build
        run: |
          python scripts/build.py
          python scripts/build.py --output "$RUNNER_TEMP/term-atlas-build"
          diff -ru dist "$RUNNER_TEMP/term-atlas-build"
